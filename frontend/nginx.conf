# ============================================================
# EchoDesk 前端站点配置（M-F6）
# 容器内路径：/etc/nginx/conf.d/default.conf（nginx:1.27-alpine）
#
# 职责：
#   1. 托管 vite 构建产物（SPA：未命中路径回退 index.html）
#   2. 同源反代 memory-service——/api（REST）与 /v1（聊天 SSE）
#      SSE 必须 proxy_buffering off：Nginx 默认会攒满缓冲区才下发，
#      流式打字机效果失效（增量滞后、一次性到达）
# ============================================================

server {
    listen 80;
    # IPv6 监听：容器内 healthcheck/调试工具对 localhost 的解析优先
    # 走 [::1]（busybox wget 无 IPv4 回退），仅 listen 80 会被拒连
    listen [::]:80;
    server_name _;

    # 静态站点根目录：覆盖官方 default.conf 后必须显式声明
    # （nginx 默认 root 是 prefix/html 即 /etc/nginx/html，官方镜像
    # 依赖自带配置声明本路径，缺省会导致 SPA 全部 404→内部循环 500）
    root /usr/share/nginx/html;
    index index.html;

    # 知识库上传上限 20MB（前端客户端校验之外的服务端兜底）+ 余量
    client_max_body_size 25m;

    # gzip 仅压缩静态文本资源；text/event-stream 刻意不压缩——
    # gzip 需要攒数据填缓冲区，会破坏 SSE 的增量下发节奏
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 带内容哈希的静态资源：长缓存（文件名变即缓存失效，安全）
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 健康检查透传：经 3000 即可验证「Nginx → memory-service」端到端链路
    location = /healthz {
        proxy_pass http://memory-service:8100;
        access_log off;
    }

    # ---------- REST API 反代（同源转发，无跨域） ----------
    location /api/ {
        proxy_pass http://memory-service:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 知识库上传为请求内同步解析切片，大文件留足超时
        proxy_read_timeout 120s;
    }

    # ---------- 聊天 SSE 反代（POST + text/event-stream） ----------
    location /v1/ {
        proxy_pass http://memory-service:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE 关键配置：关缓冲与缓存（增量即时下发）；HTTP/1.1 + 清空
        # Connection 头维持长连接；读超时拉长（LLM 生成与工具执行期间
        # 流可长时间静默）。后端响应头 X-Accel-Buffering: no 时 Nginx
        # 同样不缓冲，与 proxy_buffering off 互为双保险
        proxy_buffering off;
        proxy_cache off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 600s;
    }

    # SPA 路由回退：react-router 深链接刷新直落 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
