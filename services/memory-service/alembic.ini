# ============================================================
# EchoDesk memory-service - Alembic config
# NOTE: keep this file ASCII-only (Windows configparser reads it
#       with the locale codec; non-ASCII comments break it).
# DB URL is injected by alembic/env.py from app Settings
# (MEMORY_SERVICE_DATABASE_URL); the value below is a placeholder.
# ============================================================

[alembic]
script_location = alembic
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
version_path_separator = os

# placeholder URL: overridden by env.py from Settings
sqlalchemy.url = driver://user:pass@localhost/dbname

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
