# ============================================================
# EchoDesk memory-service - 项目配置
# 依赖管理：uv（本地）/ pip（容器）；质量工具：ruff；测试：pytest
# ============================================================
[project]
name = "memory-service"
version = "0.1.0"
description = "EchoDesk memory-service：四层记忆与上下文组装核心服务（AI 长会话知识工作台）"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",          # 运行时异步驱动
    "psycopg[binary]>=3.1",   # alembic 迁移用同步驱动
    "alembic>=1.13",
    "redis>=5.0",
    "pyjwt>=2.8",
    "bcrypt>=4.1",           # 密码哈希（M-02 认证）
    "httpx>=0.27",           # LLM OpenAI 兼容客户端（M-08）
    "pgvector>=0.3",         # pgvector SQLAlchemy 类型（M-04 记忆向量）
    "pyyaml>=6.0",           # 上下文预算 profile 加载（M-05 config/budgets/*.yaml）
    "pypdf>=4.0",            # RAG 知识库 PDF 解析（M-07）
    "python-docx>=1.1",      # RAG 知识库 DOCX 解析（M-07）
    "jieba>=0.42",           # RAG 中文分词（M-07 BM25 索引侧）
    "rank-bm25>=0.2",        # RAG BM25 关键词召回路（M-07）
    "python-multipart>=0.0.9", # FastAPI multipart 文件上传解析（M-07 知识库）
    "langfuse>=4,<5",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    # ruff 必须锁 patch 版本：format 规则随版本漂移会导致"全库重排"假差异
    "ruff==0.16.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ---------- ruff：lint + format ----------
[tool.ruff]
line-length = 100
target-version = "py311"
# alembic/versions 为自动生成的迁移脚本，不做人工风格约束
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle 错误
    "W",   # pycodestyle 警告
    "F",   # pyflakes
    "I",   # import 排序
    "UP",  # pyupgrade
    "B",   # bugbear 常见陷阱
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

# ---------- pytest ----------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
