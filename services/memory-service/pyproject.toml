# ============================================================
# EchoDesk memory-service - 项目配置
# 依赖管理：uv（本地）/ pip（容器）；质量工具：ruff；测试：pytest
# ============================================================
[project]
name = "memory-service"
version = "0.1.0"
description = "EchoDesk memory-service：四层记忆与上下文组装核心服务（AI 长会话知识工作台）"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",          # 运行时异步驱动
    "psycopg[binary]>=3.1",   # alembic 迁移用同步驱动
    "alembic>=1.13",
    "redis>=5.0",
    "pyjwt>=2.8",
    "bcrypt>=4.1",           # 密码哈希（M-02 认证）
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ---------- ruff：lint + format ----------
[tool.ruff]
line-length = 100
target-version = "py311"
# alembic/versions 为自动生成的迁移脚本，不做人工风格约束
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle 错误
    "W",   # pycodestyle 警告
    "F",   # pyflakes
    "I",   # import 排序
    "UP",  # pyupgrade
    "B",   # bugbear 常见陷阱
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

# ---------- pytest ----------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
